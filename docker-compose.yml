version: '3.3'

services:
  db:
    image: mysql:5.7
    container_name: recipe_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
      MYSQL_DATABASE: recipe_db
      MYSQL_USER: recipe_user
      MYSQL_PASSWORD: RecipePassword123!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - recipe-net

  wordpress:
    image: wordpress:latest
    container_name: recipe_wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: recipe_user
      WORDPRESS_DB_PASSWORD: RecipePassword123!
      WORDPRESS_DB_NAME: recipe_db
    volumes:
      - ./html:/var/www/html
    depends_on:
      - db
    networks:
      - recipe-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: recipe_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: RootPassword123!
    depends_on:
      - db
    networks:
      - recipe-net

  nginx:
    image: nginx:alpine
    container_name: recipe_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - wordpress
    networks:
      - recipe-net

  prometheus:
    image: prom/prometheus:latest
    container_name: recipe_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - recipe-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: recipe_node_exporter
    restart: always
    ports:
      - "9100:9100"
    networks:
      - recipe-net

  grafana:
    image: grafana/grafana:latest
    container_name: recipe_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - recipe-net

  loki:
    image: grafana/loki:2.9.2
    container_name: recipe_loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - recipe-net

  promtail:
    image: grafana/promtail:latest
    container_name: recipe_promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    networks:
      - recipe-net

volumes:
  db_data:

networks:
  recipe-net:
    driver: bridge
