version: '3.3'

services:
  db:
    image: mysql:5.7
    container_name: recipe_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
      MYSQL_DATABASE: recipe_db
      MYSQL_USER: recipe_user
      MYSQL_PASSWORD: RecipePassword123!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - recipe-net

  wordpress:
    image: wordpress:latest
    container_name: recipe_wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: recipe_user
      WORDPRESS_DB_PASSWORD: RecipePassword123!
      WORDPRESS_DB_NAME: recipe_db
    volumes:
      - ./html:/var/www/html
    depends_on:
      - db
    networks:
      - recipe-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: recipe_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: RootPassword123!
    depends_on:
      - db
    networks:
      - recipe-net

  nginx:
    image: nginx:alpine
    container_name: recipe_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - wordpress
    networks:
      - recipe-net

volumes:
  db_data:

networks:
  recipe-net:
    driver: bridge
